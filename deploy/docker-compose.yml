# Desde la raíz del repo:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  agente:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    restart: unless-stopped
    volumes: [agente-data:/app/data]
    ports: ["127.0.0.1:3000:3000"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile, caddy-data:/data]
volumes:
  agente-data:
  caddy-data:
